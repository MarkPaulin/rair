[package]
name = 'rair'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.83'

[lib]
crate-type = [ 'staticlib' ]
name = 'rair'

[profile.release]
lto = true

[dependencies]
extendr-api = { version = "0.8.0", features = ["result_condition"] }
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "bf4ecb0b06120d6d6e2ed831cd3a130aaa96c3a3" }
air_r_formatter = { git = "https://github.com/posit-dev/air", rev = "bf4ecb0b06120d6d6e2ed831cd3a130aaa96c3a3" }
settings = { git = "https://github.com/posit-dev/air", rev = "bf4ecb0b06120d6d6e2ed831cd3a130aaa96c3a3" }
biome_formatter = { git = "https://github.com/biomejs/biome", rev = "c13fc60726883781e4530a4437724273b560c8e0" }
extendr-macros = "0.8.1"
